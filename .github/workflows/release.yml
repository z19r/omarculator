name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: |
          tag="v$(jq -r .version manifest.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git archive --format=zip --prefix=z19r.omarculator/ -o "omarculator-$TAG.zip" HEAD -- ':(glob)*.qml' ':(glob)*.js' i18n manifest.json LICENSE README.md
      - name: Attest
        if: steps.version.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: omarculator-${{ steps.version.outputs.tag }}.zip
      - name: Tag and release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" "omarculator-$TAG.zip" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
